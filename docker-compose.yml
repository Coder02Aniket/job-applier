services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jobapplier
      POSTGRES_USER: jobapplier
      POSTGRES_PASSWORD: jobapplier
      TZ: UTC
      PGTZ: UTC
    # Keep the server timezone canonical so legacy client ids can't break startup.
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobapplier -d jobapplier"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
